<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1e38"/>
      <stop offset="100%" stop-color="#060b16"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="108" fill="url(#shieldGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- Shield Shape -->
  <path d="M 256 70 
           L 400 130 
           C 400 270, 340 376, 256 432 
           C 172 376, 112 270, 112 130 
           Z" 
        fill="#0b1329" 
        stroke="url(#tealGrad)" 
        stroke-width="12" 
        stroke-linejoin="round"/>

  <!-- Inner Defense Ring -->
  <circle cx="256" cy="245" r="95" fill="none" stroke="#1e3a5f" stroke-width="4" stroke-dasharray="8 6"/>

  <!-- Cross / Pulse Element -->
  <path d="M 234 165 h 44 v 58 h 58 v 44 h -58 v 58 h -44 v -58 h -58 v -44 h 58 Z" 
        fill="url(#redGrad)" 
        filter="url(#glow)"/>

  <!-- Star / Dot Center Beacon -->
  <circle cx="256" cy="245" r="8" fill="#ffffff" />
</svg>
